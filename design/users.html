<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>用户管理 · 星枢 NovaOps</title>
  <link rel="stylesheet" href="css/admin.css" />
  <style>
    .toolbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .toolbar-left, .toolbar-right {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }
    .filter-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }
    .filter-field label {
      font-size: var(--text-xs);
      font-weight: 500;
      color: var(--fg);
      line-height: 1.2;
    }
    .filter-select,
    .filter-input {
      height: 36px;
      min-width: 160px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--fg);
      font: inherit;
      font-size: var(--text-sm);
    }
    .filter-input {
      min-width: 220px;
    }
    .filter-input::placeholder { color: var(--muted); }
    .filter-select:hover,
    .filter-input:hover {
      border-color: color-mix(in oklab, var(--fg), transparent 70%);
    }
    .filter-select:focus-visible,
    .filter-input:focus-visible {
      outline: none;
      border-color: var(--accent);
      box-shadow: var(--focus-ring);
    }
    .filter-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 0;
    }
    .user-cell {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .user-cell .info .name { font-weight: 500; }
    .user-cell .info .email { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .row-actions { display: flex; gap: 6px; }
    .empty {
      padding: 48px 24px;
      text-align: center;
      color: var(--muted);
      font-size: var(--text-sm);
    }
    .drawer-mask {
      position: absolute;
      inset: 0;
      background: color-mix(in oklab, var(--fg), transparent 55%);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--motion-base) var(--ease-standard);
      z-index: 20;
    }
    .drawer-mask.is-open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: absolute;
      top: 0;
      right: 0;
      width: 420px;
      height: 100%;
      background: var(--bg);
      border-left: 1px solid var(--border);
      transform: translateX(100%);
      transition: transform var(--motion-base) var(--ease-standard);
      z-index: 21;
      display: flex;
      flex-direction: column;
    }
    .drawer.is-open { transform: translateX(0); }
    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
    }
    .drawer-head h2 { font-size: var(--text-lg); font-weight: 600; }
    .drawer-body {
      flex: 1;
      overflow: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .drawer-foot {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
    }
    .pager .meta { font-family: var(--font-mono); }
  </style>
</head>
<body>
  <div class="canvas" data-od-id="users-canvas">
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div class="drawer-mask" id="drawer-mask"></div>
    <aside class="drawer" id="invite-drawer" aria-hidden="true" aria-labelledby="invite-title">
      <div class="drawer-head">
        <h2 id="invite-title">邀请成员</h2>
        <button type="button" class="icon-btn" id="close-drawer" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <form class="drawer-body" id="invite-form" novalidate>
        <div class="field" data-field="email">
          <label for="invite-email">工作邮箱</label>
          <input class="input" id="invite-email" type="email" placeholder="name@company.com" />
          <span class="error-msg">请输入有效邮箱</span>
        </div>
        <div class="field" data-field="role">
          <label for="invite-role">角色</label>
          <select class="select filter-select" id="invite-role" style="width:100%;height:40px;">
            <option value="admin">工作区管理员</option>
            <option value="ops" selected>运营</option>
            <option value="viewer">只读观察者</option>
          </select>
          <span class="hint">邀请发送后，对方需在 7 天内接受。</span>
        </div>
        <div class="field" data-field="note">
          <label for="invite-note">备注（可选）</label>
          <textarea class="textarea" id="invite-note" placeholder="例如：负责华东门店运营"></textarea>
        </div>
      </form>
      <div class="drawer-foot">
        <button type="button" class="btn btn-secondary" id="cancel-invite">取消</button>
        <button type="submit" form="invite-form" class="btn btn-primary">发送邀请</button>
      </div>
    </aside>

    <div class="shell" data-admin-shell data-page="users" data-title="用户管理" data-content-id="users-content">
      <aside class="sidebar" data-od-id="sidebar">
        <a class="brand" href="index.html" title="返回入口">
          <div class="brand-mark" aria-hidden="true">N</div>
          <div>
            <div class="brand-name">星枢 NovaOps</div>
            <div class="brand-sub">星海科技 · 生产环境</div>
          </div>
        </a>
        <nav class="nav" aria-label="主导航">
          <div class="nav-label">总览</div>
          <a class="nav-item" href="dashboard.html" data-nav="dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-5v-5H10v5H5a1 1 0 0 1-1-1v-8Z"/></svg>
            仪表盘
          </a>
          <div class="nav-label">组织</div>
          <a class="nav-item is-active" href="users.html" data-nav="users">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="3"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            用户管理
          </a>
          <a class="nav-item" href="settings.html" data-nav="settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.3.6.9 1 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
            个人设置
          </a>
        </nav>
      </aside>
      <div class="main">
        <header class="topbar" data-od-id="topbar">
          <div class="topbar-left">
            <nav class="breadcrumb" aria-label="面包屑">
              <a href="index.html">首页</a>
              <span class="breadcrumb-sep" aria-hidden="true">/</span>
              <span class="breadcrumb-current">用户管理</span>
            </nav>
            <div class="topbar-title">用户管理</div>
          </div>
          <div class="topbar-actions">
            <button type="button" class="icon-btn theme-toggle-btn" data-theme-toggle data-theme-state="light"
              aria-pressed="false" aria-label="当前浅色主题，点击切换为深色" title="浅色主题">
              <svg data-theme-icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
              </svg>
            </button>
            <button type="button" class="icon-btn" id="notify-btn" aria-label="通知">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M6 9a6 6 0 0 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9"/>
                <path d="M10 20a2 2 0 0 0 4 0"/>
              </svg>
            </button>
            <div class="dropdown" data-user-menu>
              <button type="button" class="user-menu-trigger" data-user-menu-trigger
                aria-label="用户菜单" aria-haspopup="menu" aria-expanded="false" aria-controls="user-menu-panel">
                <div class="avatar" aria-hidden="true">陈</div>
              </button>
              <div class="dropdown-menu" id="user-menu-panel" data-user-menu-panel role="menu" hidden>
                <div class="dropdown-head">
                  <div class="name">陈思远</div>
                  <div class="email">chen@xinghai.cn</div>
                </div>
                <a class="dropdown-item" role="menuitem" href="settings.html">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.3.6.9 1 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>
                  </svg>
                  个人设置
                </a>
                <div class="dropdown-sep" role="separator"></div>
                <a class="dropdown-item is-danger" role="menuitem" href="auth.html">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <path d="M16 17l5-5-5-5"/>
                    <path d="M21 12H9"/>
                  </svg>
                  退出登录
                </a>
              </div>
            </div>
          </div>
        </header>
        <main class="content" id="content" data-od-id="users-content">
          <div class="page-head">
            <div>
              <h1>成员与权限</h1>
              <p class="desc">管理本工作区账号、角色与访问状态。</p>
            </div>
            <button type="button" class="btn btn-primary" id="open-invite">邀请成员</button>
          </div>

          <section class="panel" data-od-id="users-table-panel">
            <form class="toolbar" id="users-filter-form" style="padding:16px 16px 0;" data-od-id="users-filters">
              <div class="toolbar-left">
                <div class="filter-field">
                  <label for="user-search">关键词</label>
                  <input class="filter-input" id="user-search" type="search" placeholder="姓名或邮箱" autocomplete="off" />
                </div>
                <div class="filter-field">
                  <label for="role-filter">角色</label>
                  <select class="filter-select" id="role-filter">
                    <option value="all">全部角色</option>
                    <option value="admin">工作区管理员</option>
                    <option value="ops">运营</option>
                    <option value="viewer">只读观察者</option>
                  </select>
                </div>
                <div class="filter-field">
                  <label for="status-filter">状态</label>
                  <select class="filter-select" id="status-filter">
                    <option value="all">全部状态</option>
                    <option value="active">正常</option>
                    <option value="invited">待接受</option>
                    <option value="disabled">已停用</option>
                  </select>
                </div>
                <div class="filter-actions">
                  <button type="submit" class="btn btn-primary btn-sm" id="query-btn">查询</button>
                  <button type="button" class="btn btn-secondary btn-sm" id="reset-btn">重置</button>
                </div>
              </div>
              <div class="toolbar-right">
                <button type="button" class="btn btn-secondary btn-sm" id="export-btn">导出 CSV</button>
              </div>
            </form>
            <div class="panel-body" style="padding:0;">
              <table class="ds-table" id="users-table">
                <thead>
                  <tr>
                    <th>成员</th>
                    <th>角色</th>
                    <th>状态</th>
                    <th>最近登录</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="users-tbody"></tbody>
              </table>
              <div class="empty" id="users-empty" hidden>没有符合条件的成员。</div>
              <div class="pager">
                <span class="meta" id="pager-meta">显示 1–6 / 共 6</span>
                <div class="toolbar-right">
                  <button type="button" class="btn btn-secondary btn-sm" disabled>上一页</button>
                  <button type="button" class="btn btn-secondary btn-sm" disabled>下一页</button>
                </div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>
  </div>

  <script src="js/layout.js"></script>
  <script>
    /** @typedef {{id:string,name:string,email:string,role:string,roleLabel:string,status:string,statusLabel:string,lastLogin:string,initial:string}} UserRow */

    /** @type {UserRow[]} */
    const USERS = [
      { id: "u1", name: "陈思远", email: "chen@xinghai.cn", role: "admin", roleLabel: "工作区管理员", status: "active", statusLabel: "正常", lastLogin: "今天 09:14", initial: "陈" },
      { id: "u2", name: "林晓", email: "linxiao@xinghai.cn", role: "ops", roleLabel: "运营", status: "active", statusLabel: "正常", lastLogin: "今天 11:02", initial: "林" },
      { id: "u3", name: "周明", email: "zhouming@xinghai.cn", role: "ops", roleLabel: "运营", status: "active", statusLabel: "正常", lastLogin: "昨天 18:41", initial: "周" },
      { id: "u4", name: "赵倩", email: "zhao@xinghai.cn", role: "viewer", roleLabel: "只读观察者", status: "active", statusLabel: "正常", lastLogin: "3 天前", initial: "赵" },
      { id: "u5", name: "韩磊", email: "hanlei@partner.cn", role: "viewer", roleLabel: "只读观察者", status: "invited", statusLabel: "待接受", lastLogin: "—", initial: "韩" },
      { id: "u6", name: "旧账号-华东", email: "legacy-east@xinghai.cn", role: "ops", roleLabel: "运营", status: "disabled", statusLabel: "已停用", lastLogin: "2025-11-02", initial: "旧" }
    ];

    const showToast = window.NovaOps.showToast;

    /**
     * @param {string} status
     * @returns {string}
     */
    function statusBadge(status) {
      if (status === "active") return "badge badge-dot badge-success";
      if (status === "invited") return "badge badge-dot badge-warn";
      return "badge badge-dot badge-muted";
    }

    /** @type {{q:string,role:string,status:string}} */
    let appliedFilters = { q: "", role: "all", status: "all" };

    /**
     * @returns {{q:string,role:string,status:string}}
     */
    function readFilterForm() {
      return {
        q: document.getElementById("user-search").value.trim().toLowerCase(),
        role: document.getElementById("role-filter").value,
        status: document.getElementById("status-filter").value
      };
    }

    /**
     * @returns {UserRow[]}
     */
    function filteredUsers() {
      const { q, role, status } = appliedFilters;
      return USERS.filter((u) => {
        const matchQ = !q || u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q);
        const matchRole = role === "all" || u.role === role;
        const matchStatus = status === "all" || u.status === status;
        return matchQ && matchRole && matchStatus;
      });
    }

    function renderUsers() {
      const rows = filteredUsers();
      const tbody = document.getElementById("users-tbody");
      const empty = document.getElementById("users-empty");
      const table = document.getElementById("users-table");
      document.getElementById("pager-meta").textContent = `显示 1–${rows.length} / 共 ${rows.length}`;
      if (!rows.length) {
        tbody.innerHTML = "";
        table.hidden = true;
        empty.hidden = false;
        return;
      }
      table.hidden = false;
      empty.hidden = true;
      tbody.innerHTML = rows.map((u) => `
        <tr data-id="${u.id}">
          <td>
            <div class="user-cell">
              <div class="avatar">${u.initial}</div>
              <div class="info">
                <div class="name">${u.name}</div>
                <div class="email">${u.email}</div>
              </div>
            </div>
          </td>
          <td>${u.roleLabel}</td>
          <td><span class="${statusBadge(u.status)}">${u.statusLabel}</span></td>
          <td class="num">${u.lastLogin}</td>
          <td>
            <div class="row-actions">
              <button type="button" class="btn btn-ghost btn-sm" data-action="resend" data-id="${u.id}" ${u.status !== "invited" ? "disabled" : ""}>重发邀请</button>
              <button type="button" class="btn btn-ghost btn-sm" data-action="toggle" data-id="${u.id}">${u.status === "disabled" ? "启用" : "停用"}</button>
            </div>
          </td>
        </tr>
      `).join("");
    }

    /**
     * @param {boolean} open
     */
    function setDrawer(open) {
      document.getElementById("invite-drawer").classList.toggle("is-open", open);
      document.getElementById("drawer-mask").classList.toggle("is-open", open);
      document.getElementById("invite-drawer").setAttribute("aria-hidden", String(!open));
      if (open) document.getElementById("invite-email").focus();
    }

    document.getElementById("open-invite").addEventListener("click", () => setDrawer(true));
    document.getElementById("close-drawer").addEventListener("click", () => setDrawer(false));
    document.getElementById("cancel-invite").addEventListener("click", () => setDrawer(false));
    document.getElementById("drawer-mask").addEventListener("click", () => setDrawer(false));

    document.getElementById("users-filter-form").addEventListener("submit", (e) => {
      e.preventDefault();
      appliedFilters = readFilterForm();
      renderUsers();
      showToast(`已查询到 ${filteredUsers().length} 名成员`);
    });

    document.getElementById("reset-btn").addEventListener("click", () => {
      document.getElementById("user-search").value = "";
      document.getElementById("role-filter").value = "all";
      document.getElementById("status-filter").value = "all";
      appliedFilters = { q: "", role: "all", status: "all" };
      renderUsers();
      showToast("已重置筛选条件");
    });

    document.getElementById("export-btn").addEventListener("click", () => {
      showToast(`已导出 ${filteredUsers().length} 名成员（演示）`);
    });

    document.getElementById("users-tbody").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      const user = USERS.find((u) => u.id === btn.dataset.id);
      if (!user) return;
      if (btn.dataset.action === "resend") {
        showToast(`已向 ${user.email} 重发邀请`);
        return;
      }
      if (btn.dataset.action === "toggle") {
        if (user.id === "u1") {
          showToast("不能停用当前登录管理员", "error");
          return;
        }
        if (user.status === "disabled") {
          user.status = "active";
          user.statusLabel = "正常";
          showToast(`已启用 ${user.name}`);
        } else {
          user.status = "disabled";
          user.statusLabel = "已停用";
          showToast(`已停用 ${user.name}`);
        }
        renderUsers();
      }
    });

    document.getElementById("invite-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const emailField = document.querySelector("#invite-form [data-field='email']");
      const email = document.getElementById("invite-email").value.trim();
      const role = document.getElementById("invite-role").value;
      const roleLabel = document.getElementById("invite-role").selectedOptions[0].textContent;
      const bad = !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      emailField.classList.toggle("is-invalid", bad);
      if (bad) return;
      if (USERS.some((u) => u.email.toLowerCase() === email.toLowerCase())) {
        emailField.classList.add("is-invalid");
        emailField.querySelector(".error-msg").textContent = "该邮箱已在工作区中";
        return;
      }
      emailField.querySelector(".error-msg").textContent = "请输入有效邮箱";
      USERS.unshift({
        id: "u" + Date.now(),
        name: email.split("@")[0],
        email,
        role,
        roleLabel,
        status: "invited",
        statusLabel: "待接受",
        lastLogin: "—",
        initial: email.slice(0, 1).toUpperCase()
      });
      document.getElementById("invite-form").reset();
      setDrawer(false);
      renderUsers();
      showToast(`邀请已发送至 ${email}`);
    });

    renderUsers();
  </script>
</body>
</html>
